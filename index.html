<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>춘천에서 내 전공 키우기</title><style>
:root{--ink:#252b42;--sky:#69b9f9;--cream:#fff9e9;--yellow:#ffda55;--blue:#244f91}*{box-sizing:border-box}body{margin:0;background:#c9e7ff;color:var(--ink);font-family:system-ui,'Apple SD Gothic Neo',sans-serif}button{font:inherit;cursor:pointer}.app{max-width:850px;min-height:100vh;margin:auto;background:linear-gradient(#68b9fc 0 36%,#bfe7ff 65%,#e8f5e7);border-left:4px solid #263047;border-right:4px solid #263047;padding:16px 20px 35px;position:relative;overflow:hidden}.app:before{content:'☁️　　　　　　　 ☁️　　　　　 ☁️';position:absolute;top:58px;left:0;right:0;font-size:30px;opacity:.8;pointer-events:none}.mast{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:13px;font-weight:1000;background:var(--cream);border:3px solid var(--ink);padding:8px 12px;box-shadow:4px 4px var(--ink)}.tiny{font-size:12px;font-weight:900}.screen{position:relative;margin:25px 0 15px}.title{text-align:center;font-weight:1000;font-size:clamp(30px,7vw,58px);line-height:1.16;letter-spacing:-2px;color:white;text-shadow:4px 4px #253451,-2px -2px #253451,2px -2px #253451,-2px 2px #253451,5px 6px #253451}.subtitle{text-align:center;font-size:13px;font-weight:900;background:#fff7e2;border:3px solid var(--ink);padding:7px 12px;width:max-content;max-width:100%;margin:12px auto}.land{height:180px;position:relative;margin-top:8px;background:linear-gradient(transparent 62%,#72bd80 62% 69%,#509d73 69%);border-bottom:5px solid #294d57}.mountain{position:absolute;bottom:25px;width:160px;height:90px;background:#4c8e83;clip-path:polygon(0 100%,48% 0,100% 100%)}.mountain.two{right:0;background:#398a9c;transform:scale(1.3)}.building{position:absolute;bottom:0;width:67px;height:75px;background:#f3eddd;border:4px solid #33445b;box-shadow:inset 0 12px #9da9ba}.building:after{content:'▪ ▪\A▪ ▪';white-space:pre;position:absolute;left:11px;top:20px;font-size:22px;line-height:18px;color:#56677f}.building.b1{left:8%}.building.b2{right:11%;height:100px}.building.b3{left:34%;height:55px}.character{position:relative;z-index:2;width:136px;height:154px;image-rendering:pixelated;margin:auto;filter:drop-shadow(5px 6px 0 #22384a55)}.character svg{width:100%;height:100%;image-rendering:pixelated;shape-rendering:crispEdges}.character.running{animation:bob .55s steps(2) infinite}@keyframes bob{50%{transform:translateY(-9px) rotate(-3deg)}}.pixel-scene{display:flex;align-items:center;justify-content:center;min-height:185px}.btn{background:var(--yellow);border:4px solid var(--ink);box-shadow:5px 5px var(--ink);border-radius:8px;padding:13px 20px;font-weight:1000;color:var(--ink);font-size:17px}.btn:active{transform:translate(3px,3px);box-shadow:2px 2px var(--ink)}.btn.secondary{background:#fff9e9}.btn.small{font-size:13px;padding:9px 12px;border-width:3px;box-shadow:3px 3px var(--ink)}.btn:disabled{opacity:.4}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}.panel{position:relative;background:var(--cream);border:4px solid var(--ink);box-shadow:6px 6px var(--ink);border-radius:12px;padding:20px;margin:22px 0}.panel h2{margin:0 0 15px;text-align:center;font-size:26px}.panel h3{margin:0 0 7px}.muted{color:#596078;font-size:13px}.major-grid,.jobs-grid,.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.major-card,.job-card,.info-card{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:12px 8px;text-align:center;box-shadow:3px 3px var(--ink)}.major-card{min-height:152px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;font-weight:900}.major-card[aria-pressed=true]{background:#ffe084;outline:4px solid #ffad33}.major-card .ico{font-size:42px}.job-card{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:157px}.job-card .ico{font-size:45px}.job-card b{font-size:14px}.job-card .btn{margin-top:auto}.info-card{font-size:13px;font-weight:900;min-height:100px}.info-card .ico{font-size:30px;display:block;margin-bottom:8px}.info-card.active{background:#ffde69}.status{background:#d9efff;border:3px solid var(--ink);border-radius:9px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.progress{height:14px;border:3px solid var(--ink);background:white;flex:1;max-width:230px}.progress div{height:100%;background:#ffd24c;transition:width .2s}.detail-head{display:flex;align-items:center;gap:14px;justify-content:center}.detail-head .character{margin:0;width:112px;height:128px}.info-body{background:white;border:3px solid var(--ink);padding:15px;margin-top:15px;border-radius:8px;min-height:140px}.info-body ul{margin:5px 0;padding-left:22px;line-height:2}.info-body li{font-weight:700}.pill{display:inline-block;background:#f5d85b;border:2px solid var(--ink);font-weight:900;padding:4px 8px;font-size:12px}.hidden{display:none!important}footer{text-align:center;font-size:11px;line-height:1.6;margin:30px 0;color:#324761}a{color:#205b9d;font-weight:900}@media(max-width:540px){.app{padding:12px}.panel{padding:14px}.major-grid,.jobs-grid{gap:7px}.major-card,.job-card{padding:9px 4px;min-height:145px}.major-card{font-size:12px}.major-card .ico,.job-card .ico{font-size:34px}.job-card b{font-size:12px}.job-card .btn{font-size:10px;padding:7px 4px}.info-grid{gap:7px}.info-card{font-size:11px;padding:8px 3px}.title{font-size:38px}.land{height:155px}.detail-head .character{width:86px}.panel h2{font-size:22px}}
</style></head><body><main class="app"><header class="mast"><div class="logo">🎓 춘천 취준생 도감</div><span class="tiny">CAREER QUEST · 01</span></header>
<section id="home" class="screen"><h1 class="title">춘천에서<br>내 전공 키우기!</h1><p class="subtitle">졸업 전에 직업부터 찾아보자</p><div class="land"><div class="mountain"></div><div class="mountain two"></div><div class="building b1"></div><div class="building b2"></div><div class="building b3"></div><div class="pixel-scene" id="homeCharacter"></div></div><div class="actions"><button class="btn" id="start">게임 시작 ▶</button><button class="btn secondary" id="openSaved">★ 내 도감</button></div></section>
<section id="select" class="panel hidden"><h2>🎓 전공 선택</h2><div class="major-grid" id="majors"></div><div class="actions"><button class="btn" id="selectMajor">선택하기 ▶</button></div></section>
<section id="hub" class="panel hidden"><div class="status"><b id="statusText">LV.1 취준생</b><div class="progress"><div id="progressFill" style="width:0%"></div></div><span id="progressText">0/9</span></div><div class="pixel-scene" id="hubCharacter"></div><h2 id="hubTitle">직업 탐색</h2><div class="actions"><button class="btn" id="openJobs">🔍 직업 탐색</button><button class="btn secondary" id="openSaved2">★ 관심 목록</button><button class="btn secondary small" id="changeMajor">전공 변경</button></div></section>
<section id="jobs" class="panel hidden"><button class="btn secondary small" id="jobsBack">← 돌아가기</button><h2 id="jobsTitle">직업 도감</h2><div class="jobs-grid" id="jobCards"></div></section>
<section id="detail" class="panel hidden"><button class="btn secondary small" id="detailBack">← 직업 목록</button><div class="detail-head"><div id="detailCharacter"></div><div><span class="pill" id="detailLevel">LV.1</span><h2 id="detailTitle"></h2><div class="muted" id="detailSummary"></div></div></div><div class="info-grid" id="infoTabs"></div><div class="info-body" id="infoBody"></div><div class="actions"><button class="btn" id="nextInfo">다음 ▶</button><button class="btn secondary" id="bookmark">☆ 저장</button></div><div class="muted" style="text-align:center">※ 레벨은 직업 정보 탐색 진행도예요.</div></section>
<section id="saved" class="panel hidden"><button class="btn secondary small" id="savedBack">← 돌아가기</button><h2>★ 관심 직업</h2><div class="jobs-grid" id="savedCards"></div></section>
<footer>직업 소개용 교육 시제품 · 춘천 지역 채용 여부는 별도 확인 필요<br>직업 정보를 확인했다고 실제 취업 역량이 상승하는 것은 아닙니다.</footer></main><script>
const data={
human:[{id:'planner',name:'문화사업 기획자',emoji:'🎪',summary:'지역 문화 행사와 사업을 기획·운영하는 직무',tasks:['문화 프로그램 기획','행사 운영 및 예산 관리','참여자·협력기관 소통'],skills:['기획서 작성','예산·일정 관리','커뮤니케이션'],path:['지역 문화행사 조사','기획 프로젝트 참여','관련 기관 채용 요건 확인']},{id:'admin',name:'행정·사업 운영 담당자',emoji:'📑',summary:'조직의 사업 운영과 행정 업무를 지원하는 직무',tasks:['사업 문서 관리','일정·예산 지원','대내외 협업'],skills:['문서 작성','엑셀 활용','문제 해결'],path:['직무 공고 분석','문서 작성 연습','현장실습 탐색']},{id:'research',name:'리서치 담당자',emoji:'🔎',summary:'자료를 수집·분석해 의사결정을 돕는 직무',tasks:['자료 조사','설문·인터뷰','보고서 작성'],skills:['조사 설계','자료 분석','보고서 작성'],path:['조사 프로젝트 수행','분석 도구 학습','관련 직무 탐색']}],
media:[{id:'marketer',name:'콘텐츠 마케터',emoji:'📱',summary:'브랜드 콘텐츠를 기획하고 홍보 성과를 분석하는 직무',tasks:['SNS 콘텐츠 기획','캠페인 운영','성과 분석'],skills:['글쓰기·기획','콘텐츠 제작','기초 데이터 분석'],path:['콘텐츠 포트폴리오 제작','지역 프로젝트 탐색','홍보·마케팅 공고 확인']},{id:'designer',name:'시각 디자이너',emoji:'🎨',summary:'시각적 메시지를 이미지와 디자인으로 표현하는 직무',tasks:['홍보물 디자인','브랜드 시각물 제작','디자인 수정·협업'],skills:['디자인 도구','타이포그래피','포트폴리오'],path:['작품 정리','실무 프로젝트','디자인 직무 공고 탐색']},{id:'video',name:'영상 콘텐츠 제작자',emoji:'🎬',summary:'영상 콘텐츠를 기획·촬영·편집하는 직무',tasks:['영상 기획','촬영 및 편집','배포 채널 관리'],skills:['편집 툴','스토리텔링','협업'],path:['짧은 영상 제작','제작 프로젝트','영상 관련 직무 탐색']}],
bio:[{id:'lab',name:'연구보조원',emoji:'🧪',summary:'연구실에서 실험과 자료 정리를 지원하는 직무',tasks:['실험 보조','실험 기록','연구 자료 정리'],skills:['실험 기초','안전 수칙','기록 정확성'],path:['관심 연구실 탐색','연구 경험 쌓기','모집 자격 확인']},{id:'qc',name:'품질관리 담당자',emoji:'🔬',summary:'제품과 공정의 품질을 점검하고 기록하는 직무',tasks:['검사·시험','품질 문서 작성','기준 준수 확인'],skills:['품질 기준 이해','기록 관리','분석 능력'],path:['관련 기준 학습','실습 경험','기업별 지원 요건 확인']},{id:'data',name:'데이터 분석 담당자',emoji:'💻',summary:'데이터를 정리하고 분석해 업무 개선에 활용하는 직무',tasks:['데이터 정제','분석·시각화','결과 보고'],skills:['스프레드시트','SQL·통계 기초','문제 정의'],path:['데이터 프로젝트','분석 포트폴리오','관련 직무 조사']}]
};
const labels={human:'인문·사회',media:'콘텐츠·디자인',bio:'바이오·이공'},icons={human:'📚',media:'📷',bio:'🧪'};let major='human',job=null,tab=0,returnTo='hub';
const $=s=>document.querySelector(s);const all=Object.values(data).flat();let saved=read('careerSaved',[]),visited=read('careerVisited',{});function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}function persist(){localStorage.setItem('careerSaved',JSON.stringify(saved));localStorage.setItem('careerVisited',JSON.stringify(visited))}
function character(stage=0){const shades=['#263b67','#273e71','#203e70','#29476b'];const hair='#563426',skin='#f5bd8f',outline='#273147';const blocks=[];const add=(x,y,w,h,c)=>blocks.push('<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>');add(8,3,8,2,hair);add(5,5,13,2,hair);add(4,7,15,2,hair);add(5,9,13,6,skin);add(5,9,2,6,hair);add(7,11,4,3,outline);add(12,11,4,3,outline);add(8,12,2,1,'#fff');add(13,12,2,1,'#fff');add(11,12,1,1,outline);add(10,15,4,1,'#c77766');add(7,16,11,9,shades[stage%4]);add(10,16,3,6,'#fff');add(11,18,1,5,'#e54b4b');add(4,18,3,7,shades[stage%4]);add(18,18,3,6,shades[stage%4]);add(3,24,4,2,skin);add(19,23,3,2,skin);add(7,25,5,5,'#263247');add(13,25,5,5,'#263247');add(5,29,7,2,outline);add(13,29,8,2,outline);if(stage>=1){add(19,20,6,5,'#a35d33');add(20,19,4,1,'#a35d33')}if(stage>=2){add(18,18,8,5,'#dbe9f5');add(19,19,6,3,'#7caccf')}if(stage>=3){add(18,17,8,6,'#ffd653');add(20,19,4,2,'#fff')}return '<div class="character '+(stage===0?'running':'')+'"><svg viewBox="0 0 32 34" xmlns="http://www.w3.org/2000/svg" aria-label="안경 쓴 픽셀아트 취준생 캐릭터">'+blocks.join('')+'</svg></div>'}
$('#homeCharacter').innerHTML=character(0);$('#hubCharacter').innerHTML=character(0);
function show(id){['home','select','hub','jobs','detail','saved'].forEach(s=>$('#'+s).classList.toggle('hidden',s!==id));window.scrollTo({top:0,behavior:'instant'})}
function chooseMajor(){ $('#majors').replaceChildren();Object.keys(labels).forEach(k=>{const b=document.createElement('button');b.className='major-card';b.setAttribute('aria-pressed',String(major===k));b.innerHTML='<span class="ico">'+icons[k]+'</span><span>'+labels[k]+'</span>';b.onclick=()=>{major=k;chooseMajor()};$('#majors').append(b)})}
function hub(){const n=data[major].filter(j=>visited[j.id]?.length===3).length;$('#statusText').textContent='LV.'+(n+1)+' 탐색가';$('#progressText').textContent=n+'/3';$('#progressFill').style.width=(n/3*100)+'%';$('#hubTitle').textContent=labels[major]+' 직업 탐색';$('#hubCharacter').innerHTML=character(Math.min(3,n));show('hub')}
function makeCards(items,target){const root=$(target);root.replaceChildren();if(!items.length){root.textContent='아직 저장된 직업이 없어요.';return}items.forEach(j=>{const c=document.createElement('div');c.className='job-card';const emoji=document.createElement('div');emoji.className='ico';emoji.textContent=j.emoji;const name=document.createElement('b');name.textContent=j.name;const b=document.createElement('button');b.className='btn small';b.textContent='살펴보기 ▶';b.onclick=()=>{job=j;tab=0;returnTo=target==='#savedCards'?'saved':'jobs';detail()};c.append(emoji,name,b);root.append(c)})}
function jobs(){ $('#jobsTitle').textContent=labels[major]+' 직업 도감';makeCards(data[major],'#jobCards');show('jobs')}
function detail(){show('detail');$('#detailTitle').textContent=job.name;$('#detailSummary').textContent=job.summary;$('#detailLevel').textContent='탐색 LV.'+(tab+1);$('#detailCharacter').innerHTML=character(tab+1);const tabs=[['🎬','하는 일'],['⭐','필요 역량'],['🗺️','준비 경로']];$('#infoTabs').replaceChildren();tabs.forEach(([ico,name],i)=>{const b=document.createElement('button');b.className='info-card'+(tab===i?' active':'');b.innerHTML='<span class="ico">'+ico+'</span>'+name;b.onclick=()=>{tab=i;detail()};$('#infoTabs').append(b)});const ul=document.createElement('ul');[job.tasks,job.skills,job.path][tab].forEach(t=>{const li=document.createElement('li');li.textContent=t;ul.append(li)});$('#infoBody').replaceChildren(ul);if(tab===2){const p=document.createElement('p');p.className='muted';p.textContent='춘천 지역의 실제 채용·활동 여부는 공식 공고를 확인하세요.';const a=document.createElement('a');a.href='https://www.work24.go.kr/';a.target='_blank';a.rel='noopener noreferrer';a.textContent='고용24에서 확인 ↗';$('#infoBody').append(p,a)}$('#nextInfo').textContent=tab===2?'탐색 완료 ✓':'다음 ▶';$('#bookmark').textContent=saved.includes(job.id)?'★ 저장됨':'☆ 저장';const seen=new Set(visited[job.id]||[]);seen.add(tab);visited[job.id]=[...seen];persist()}
$('#start').onclick=()=>{chooseMajor();show('select')};$('#selectMajor').onclick=hub;$('#openJobs').onclick=jobs;$('#changeMajor').onclick=()=>{chooseMajor();show('select')};$('#jobsBack').onclick=hub;$('#detailBack').onclick=()=>returnTo==='saved'?openSaved():jobs();$('#nextInfo').onclick=()=>{if(tab<2){tab++;detail()}else{hub()}};$('#bookmark').onclick=()=>{saved=saved.includes(job.id)?saved.filter(id=>id!==job.id):[...saved,job.id];persist();detail()};function openSaved(){makeCards(all.filter(j=>saved.includes(j.id)),'#savedCards');show('saved')}$('#openSaved').onclick=openSaved;$('#openSaved2').onclick=openSaved;$('#savedBack').onclick=hub;
</script></body></html>
